<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="contenedor">
    <div class="marca">Plataforma Educativa</div>
    <h1>Crea tu cuenta</h1>

    <form id="formRegistro">
      <div>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />
      </div>

      <p class="mensaje-error" id="mensajeError"></p>

      <button type="submit" id="btnRegistrar">Registrarme</button>
    </form>

    <div class="tarjeta-codigo" id="tarjetaCodigo">
      <div class="etiqueta">Tu código de identificación</div>
      <div class="codigo" id="codigoGenerado">ALU-00000</div>
      <p class="nota">
        Guarda este código: lo necesitarás junto a tu contraseña para iniciar sesión.
        También te lo hemos enviado por correo.
      </p>
      <button id="btnIrLogin">Ir a iniciar sesión</button>
    </div>

    <p class="enlace-secundario">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
