<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="contenedor">
    <div class="marca">Plataforma Educativa</div>
    <h1>Inicia sesión</h1>

    <form id="formLogin">
      <div>
        <label for="codigoUsuario">Código de usuario</label>
        <input type="text" id="codigoUsuario" placeholder="ALU-00000" required autocomplete="username" />
      </div>
      <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>

      <p class="mensaje-error" id="mensajeError"></p>

      <button type="submit" id="btnLogin">Entrar</button>
    </form>

    <p class="enlace-secundario">
      ¿No tienes cuenta? <a href="register.html">Regístrate</a>
    </p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
