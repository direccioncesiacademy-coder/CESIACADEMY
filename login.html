<!DOCTYPE html>
<html>
<head>
    <title>CESI Academy - Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .login-container h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-login:hover {
            background: #5568d3;
        }
        .error {
            color: #ff6b6b;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🎓 CESI Academy</h1>
        <h2 style="text-align: center; color: #666; font-size: 18px; margin-bottom: 30px;">
            Iniciar Sesión
        </h2>
        
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" placeholder="tu@email.com">
        </div>
        
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" id="password" placeholder="Tu contraseña">
        </div>
        
        <button class="btn-login" onclick="login()">Entrar</button>
        
        <div id="error" class="error"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            if(!email || !password) {
                errorDiv.textContent = "Por favor completa todos los campos";
                return;
            }
            
            firebase.auth().signInWithEmailAndPassword(email, password)
                .then(userCredential => {
                    console.log("✅ Login exitoso:", userCredential.user.email);
                    localStorage.setItem('userEmail', userCredential.user.email);
                    window.location.href = 'index.html';
                })
                .catch(error => {
                    console.error("❌ Error en login:", error.message);
                    errorDiv.textContent = "Email o contraseña incorrectos";
                });
        }
        
        // Presionar Enter para login
        document.getElementById('password').addEventListener('keypress', function(e) {
            if(e.key === 'Enter') login();
        });
        
        // Si ya está autenticado, ir a index.html
        firebase.auth().onAuthStateChanged(user => {
            if(user) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
