<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CESI Academy - Sistema de Gestión Compartido</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estado de conexión */
        .sync-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 12px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sync-status.online {
            border-left: 4px solid #51cf66;
        }

        .sync-status.offline {
            border-left: 4px solid #ff6b6b;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .sync-dot.online {
            background: #51cf66;
        }

        .sync-dot.offline {
            background: #ff6b6b;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .sync-message {
            color: #666;
        }

        /* Indicador de cambios en tiempo real */
        .real-time-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            margin-left: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .departments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .task-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .task-filters select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
        }

        .members-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .member-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--light);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
        }

        .member-checkbox:hover {
            border-color: var(--primary);
        }

        .member-checkbox input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .export-section {
            background: var(--light);
            padding: 20px;
            border-radius: var(--radius);
            margin-top: 20px;
            text-align: center;
        }

        .export-section h3 {
            color: var(--text-primary);
            margin-bottom: 15px;
            font-size: 16px;
        }

        .export-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .members-list {
            margin-top: 15px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        /* Estilos para las tareas */
        .task-card {
            background: #f9f9f9;
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin-bottom: 12px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            animation: slideInLeft 0.3s ease;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-card:hover {
            box-shadow: var(--shadow-sm);
        }

        .task-card.completed {
            opacity: 0.7;
            border-left-color: var(--success);
        }

        .task-card.in-progress {
            border-left-color: var(--warning);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div>
                <h1><i class="fas fa-graduation-cap"></i> CESI Academy</h1>
                <p>Sistema de Gestión Compartido - Todos ven los cambios en tiempo real v3.0+Firebase</p>
            </div>
            <div class="actions">
                <select id="yearSelector" style="padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; cursor: pointer; background: white;">
                    <option value="2026">📅 2026 (Actual)</option>
                    <option value="2027">🚀 2027 (Proyectado)</option>
                </select>
                <button class="btn-primary" id="addDeptBtn" onclick="app.openModal('addDeptModal')" style="display: none;">
                    <i class="fas fa-plus"></i> Nuevo Departamento
                </button>
            </div>
        </header>

        <!-- NAVEGACIÓN -->
        <div class="nav-tabs">
            <button class="nav-btn active" data-tab="departments">
                <i class="fas fa-sitemap"></i> Departamentos
            </button>
            <button class="nav-btn" data-tab="tasks">
                <i class="fas fa-tasks"></i> Tareas
            </button>
            <button class="nav-btn" data-tab="meetings">
                <i class="fas fa-calendar-alt"></i> Reuniones
            </button>
            <button class="nav-btn" data-tab="mural">
                <i class="fas fa-sticky-note"></i> Mural
            </button>
            <button class="nav-btn" data-tab="attendance">
                <i class="fas fa-list-check"></i> Asistencia
            </button>
            <button class="nav-btn" data-tab="communications">
                <i class="fas fa-bell"></i> Comunicados
            </button>
        </div>

        <!-- TAB: DEPARTAMENTOS -->
        <div id="departments" class="tab-content active">
            <div id="departmentsContainer" class="departments-grid"></div>
        </div>

        <!-- TAB: TAREAS -->
        <div id="tasks" class="tab-content">
            <div class="task-filters">
                <select id="taskDeptFilter" onchange="app.renderTasks()">
                    <option value="">Todos los departamentos</option>
                </select>
                <select id="taskStatusFilter" onchange="app.renderTasks()">
                    <option value="">Todos los estados</option>
                    <option value="pending">Pendiente</option>
                    <option value="in-progress">En progreso</option>
                    <option value="completed">Completada</option>
                </select>
            </div>
            <div>
                <button class="btn-primary" onclick="app.openModal('addTaskGeneralModal')">
                    <i class="fas fa-plus"></i> Nueva Tarea General (Para Todos)
                </button>
            </div>
            <div id="tasksContainer"></div>
        </div>

        <!-- TAB: REUNIONES -->
        <div id="meetings" class="tab-content">
            <div style="margin-bottom: 20px;">
                <button class="btn-primary" onclick="app.openModal('addMeetingModal'); app.populateDeptSelects();">
                    <i class="fas fa-plus"></i> Nueva Reunión
                </button>
            </div>
            <div id="meetingsContainer"></div>
            <div class="export-section" style="margin-top: 30px;">
                <h3><i class="fas fa-download"></i> Exportar Reuniones</h3>
                <div class="export-buttons">
                    <button class="btn-primary" onclick="app.exportMeetingsPDF()">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                    <button class="btn-primary" onclick="app.exportMeetingsCSV()">
                        <i class="fas fa-file-csv"></i> CSV
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB: MURAL -->
        <div id="mural" class="tab-content">
            <div style="margin-bottom: 20px;">
                <button class="btn-primary" onclick="app.openModal('addNoteModal')">
                    <i class="fas fa-plus"></i> Nueva Nota
                </button>
            </div>
            <div id="muralContainer" class="grid grid-2"></div>
            <div class="export-section" style="margin-top: 30px;">
                <h3><i class="fas fa-download"></i> Exportar Mural</h3>
                <div class="export-buttons">
                    <button class="btn-primary" onclick="app.exportMuralPDF()">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                    <button class="btn-primary" onclick="app.exportMuralCSV()">
                        <i class="fas fa-file-csv"></i> CSV
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB: ASISTENCIA -->
        <div id="attendance" class="tab-content">
            <div class="section">
                <div class="section-title">
                    <i class="fas fa-calendar-check"></i> Asistencia
                </div>
                <div style="margin-bottom: 20px;">
                    <label><strong>Selecciona fecha:</strong></label>
                    <input type="date" id="attendanceDatePicker" style="padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-top: 8px;">
                </div>
                <div id="attendanceContainer"></div>
            </div>
            <div class="export-section" style="margin-top: 30px;">
                <h3><i class="fas fa-download"></i> Exportar Asistencia</h3>
                <div class="export-buttons">
                    <button class="btn-primary" onclick="app.exportAttendancePDF()">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                    <button class="btn-primary" onclick="app.exportAttendanceCSV()">
                        <i class="fas fa-file-csv"></i> CSV
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB: COMUNICADOS -->
        <div id="communications" class="tab-content">
            <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn-primary" onclick="app.openModal('addCommunicationModal', 'announcement')">
                    <i class="fas fa-bullhorn"></i> Comunicado
                </button>
                <button class="btn-warning" onclick="app.openModal('addCommunicationModal', 'request')">
                    <i class="fas fa-handshake"></i> Solicitar Reunión
                </button>
                <button class="btn-secondary" onclick="app.openModal('addCommunicationModal', 'idea')">
                    <i class="fas fa-lightbulb"></i> Nueva Idea
                </button>
            </div>
            <div id="communicationsContainer"></div>
        </div>
    </div>

    <!-- INDICADOR DE SINCRONIZACIÓN -->
    <div id="syncStatus" class="sync-status online">
        <div class="sync-dot online"></div>
        <div class="sync-message">
            Sincronizado <span id="syncTime"></span>
        </div>
    </div>

    <!-- [RESTO DE LOS MODALES IGUAL QUE ANTES] -->
    <!-- Incluye aquí todos los modales del index.html anterior -->
    
    <!-- SCRIPTS DE FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js"></script>
    <script src="firebase-config.js"></script>

    <!-- SCRIPTS PROPIOS -->
    <script src="app.js"></script>

    <!-- INICIALIZAR SINCRONIZACIÓN -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Actualizar estado de sincronización
            setInterval(() => {
                const status = document.getElementById('syncStatus');
                const time = document.getElementById('syncTime');
                
                if(typeof db !== 'undefined') {
                    status.classList.remove('offline');
                    status.classList.add('online');
                    time.textContent = new Date().toLocaleTimeString('es-ES');
                } else {
                    status.classList.remove('online');
                    status.classList.add('offline');
                    time.textContent = 'Sin conexión';
                }
            }, 1000);
        });
    </script>
</body>
</html>
